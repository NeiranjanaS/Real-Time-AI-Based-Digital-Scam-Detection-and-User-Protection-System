<!DOCTYPE html>
<html>
<head>
<title>Scan History</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h2>Scan History</h2>

<table>

<tr>
<th>Type</th>
<th>Content</th>
<th>Risk</th>
<th>Status</th>
</tr>

{% for item in history %}

<tr>

<td>{{ item.type }}</td>

<td>{{ item.content }}</td>

<td>{{ item.risk }}%</td>

<td>{{ item.status }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">⬅ Back Home</a>

</div>

</body>
</html>
